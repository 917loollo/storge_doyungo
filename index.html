<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Drive</title>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.45);
      --glass-border: rgba(255, 255, 255, 0.6);
      --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
      --primary-color: #007aff;
      --text-main: #1c1c1e;
      --text-sub: #8e8e93;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;
      color: var(--text-main);
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 20px; }
    .ios-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 24px;
      box-shadow: var(--glass-shadow);
    }
    h1, h2 { margin: 0 0 16px 0; font-size: 1.15rem; font-weight: 700; }
    .upload-box {
      border: 2px dashed rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      padding: 28px 16px;
      text-align: center;
      background: rgba(255, 255, 255, 0.25);
    }
    input[type="file"] { display: none; }
    .ios-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 122, 255, 0.3);
    }
    .ios-btn:disabled { background: rgba(142, 142, 147, 0.4); box-shadow: none; }
    .file-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.7);
      padding: 14px 18px;
      border-radius: 18px;
    }
    .file-name { font-weight: 600; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-actions a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 6px 12px;
      background: rgba(0, 122, 255, 0.12);
      border-radius: 12px;
    }
    #status { margin-top: 14px; font-size: 0.85rem; font-weight: 500; }
  </style>
</head>
<body>
  <div class="container">
    <div class="ios-card">
      <h1>파일 업로드</h1>
      <div class="upload-box">
        <input type="file" id="fileInput">
        <button class="ios-btn" onclick="document.getElementById('fileInput').click()">파일 선택</button>
        <p id="fileNameDisplay" style="margin: 12px 0; font-size: 0.85rem; color: var(--text-sub);">선택된 파일 없음</p>
        <button class="ios-btn" id="uploadBtn" onclick="uploadFile()" disabled>업로드 시작</button>
        <div id="status"></div>
      </div>
    </div>

    <div class="ios-card">
      <h2>공유 파일 목록</h2>
      <ul class="file-list" id="fileList">
        <li>목록을 불러오는 중...</li>
      </ul>
    </div>
  </div>

  <script>
    const GIST_ID = "bee335b6e3ab61f3a0181bbd3303ca1a";
    const FREEIMAGEHOST_API_KEY = "6d207e02198a847aa98d0a2a901485a5";

    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const uploadBtn = document.getElementById('uploadBtn');
    const statusDiv = document.getElementById('status');
    const fileListEl = document.getElementById('fileList');

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        fileNameDisplay.textContent = file.name;
        uploadBtn.disabled = false;
      } else {
        fileNameDisplay.textContent = '선택된 파일 없음';
        uploadBtn.disabled = true;
      }
    });

    async function uploadFile() {
      const file = fileInput.files[0];
      if (!file) return;

      uploadBtn.disabled = true;
      statusDiv.textContent = '✨ 업로드 중...';

      const formData = new FormData();
      formData.append('key', FREEIMAGEHOST_API_KEY);
      formData.append('action', 'upload');
      formData.append('source', file);

      try {
        const uploadRes = await fetch('https://freeimage.host/api/1/upload', { method: 'POST', body: formData });
        const uploadData = await uploadRes.json();
        const downloadURL = uploadData.image.url;

        statusDiv.textContent = '☁️ 동기화 중...';

        const currentFiles = await fetchGistFiles();
        currentFiles.unshift({ name: file.name, url: downloadURL });

        await updateGistFiles(currentFiles);

        statusDiv.textContent = '✅ 완료!';
        fileInput.value = '';
        fileNameDisplay.textContent = '선택된 파일 없음';
        loadFileList();
      } catch (error) {
        statusDiv.textContent = '❌ 실패: ' + error.message;
        uploadBtn.disabled = false;
      }
    }

    async function fetchGistFiles() {
      const res = await fetch(`/api/gist?gistId=${GIST_ID}`);
      return await res.json();
    }

    async function updateGistFiles(filesArray) {
      await fetch(`/api/gist?gistId=${GIST_ID}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(filesArray)
      });
    }

    async function loadFileList() {
      fileListEl.innerHTML = '<li>동기화 중...</li>';
      try {
        const files = await fetchGistFiles();
        if (!files.length) {
          fileListEl.innerHTML = '<li style="text-align:center; color:var(--text-sub);">파일이 없습니다.</li>';
          return;
        }
        fileListEl.innerHTML = '';
        files.forEach(file => {
          const li = document.createElement('li');
          li.className = 'file-item';
          li.innerHTML = `
            <span class="file-name">${file.name}</span>
            <div class="file-actions">
              <a href="${file.url}" target="_blank" rel="noopener noreferrer">보기 / 다운로드</a>
            </div>
          `;
          fileListEl.appendChild(li);
        });
      } catch (error) {
        fileListEl.innerHTML = '<li>목록 불러오기 실패</li>';
      }
    }

    loadFileList();
  </script>
</body>
</html>
